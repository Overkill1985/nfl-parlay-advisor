name: Build & Scan Image

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  # Falls back to a purely-local tag when DOCKER_USERNAME isn't configured,
  # so build+scan (which only ever load the image locally, never pull/push
  # it) work with zero Docker Hub secrets set up.
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME != '' && format('{0}/nfl-parlay-advisor', secrets.DOCKER_USERNAME) || 'local/nfl-parlay-advisor' }}
  IMAGE_TAG: latest

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        id: dockerhub_login
        # Only attempted when actually pushing, and only when both secrets
        # are configured - continue-on-error means an invalid/expired
        # credential doesn't fail the whole run either; the Push step below
        # separately checks this step's own outcome before publishing.
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker Scout vulnerability scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          only-fixed: false
          format: sarif
          output: scout-report.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-report.sarif
          category: docker-scout

      - name: Check for critical vulnerabilities
        run: |
          docker scout cves --format json ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | \
          jq -e '.summary.critical == 0' || (echo "Critical vulnerabilities found!" && exit 1)

      - name: Generate scan report (markdown)
        if: always()
        run: docker scout cves --format markdown ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} > SCAN_REPORT.md

      - name: Comment PR with scan results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('SCAN_REPORT.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🛡️ Docker Scout Vulnerability Scan\n\n' + report
            });

      - name: Upload scan report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-report
          path: SCAN_REPORT.md

      - name: Push image to Docker Hub
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.dockerhub_login.outcome == 'success' && success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
