name: Build & Scan Image

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  # Falls back to a purely-local tag when DOCKER_USERNAME isn't configured,
  # so build+scan (which only ever load the image locally, never pull/push
  # it) work with zero Docker Hub secrets set up.
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME != '' && format('{0}/nfl-parlay-advisor', secrets.DOCKER_USERNAME) || 'local/nfl-parlay-advisor' }}
  IMAGE_TAG: latest

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        # `if:` conditions can't reference the secrets context directly
        # (GitHub Actions rejects the whole workflow file if they do) - so
        # the presence check happens here, in a step's `env:`, where
        # secrets *are* allowed, and the result is exposed as an output
        # that later `if:` conditions can read instead.
        id: dockerhub_creds
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        id: dockerhub_login
        # Only attempted when actually pushing, and only when both secrets
        # are configured - continue-on-error means an invalid/expired
        # credential doesn't fail the whole run either; the Push step below
        # separately checks this step's own outcome before publishing.
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.dockerhub_creds.outputs.configured == 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy rather than Docker Scout: Scout requires Docker Hub
      # authentication for every command ("to use scout features you need to
      # be authenticated against Docker Hub"), so it can't scan at all on a
      # checkout with no DOCKER_* secrets configured - which is what kept
      # failing this pipeline. Trivy needs no account and scans the same
      # locally-loaded image.
      - name: Scan image for vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to GitHub Security tab
        # hashFiles guard: without it, `always()` would make this step fail
        # the job whenever the scan above never produced a file.
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Deliberately ordered before the critical-vulnerability gate below, so
      # the report artifact and PR comment still have content on a failing run.
      - name: Generate scan report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          output: SCAN_REPORT.md

      - name: Check for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Comment PR with scan results
        if: always() && github.event_name == 'pull_request'
        # A PR from a fork gets a read-only GITHUB_TOKEN, so commenting is
        # expected to fail there - that shouldn't fail the scan itself.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('SCAN_REPORT.md')) {
              core.info('No scan report to comment with.');
              return;
            }
            const report = fs.readFileSync('SCAN_REPORT.md', 'utf8');
            // Trivy's table output isn't markdown, and GitHub rejects
            // comment bodies over 65536 chars.
            const max = 60000;
            const body = report.length > max
              ? report.slice(0, max) + '\n...truncated, see the workflow artifact for the full report.'
              : report;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🛡️ Trivy Vulnerability Scan\n\n```\n' + body + '\n```'
            });

      - name: Upload scan report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: SCAN_REPORT.md

      - name: Push image to Docker Hub
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.dockerhub_login.outcome == 'success' && success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
